<!DOCTYPE html>
<html>
  <head>
    <title>MiniDB Book Library</title>
  </head>
  <body>
    <h1>Books</h1>
    <table border="1" cellpadding="5">
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Actions</th>
      </tr>
      {% for book in books %}
      <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.year }}</td>
        <td>
          <form
            action="{{ url_for('update_book', id=book.id) }}"
            method="post"
            style="display: inline"
          >
            <input type="text" name="title" placeholder="New title" />
            <input type="text" name="author" placeholder="New author" />
            <input type="text" name="year" placeholder="New year" />
            <button type="submit">Update</button>
          </form>
          <a href="{{ url_for('delete_book', id=book.id) }}">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </table>

    <h2>Add New Book</h2>
    <form action="{{ url_for('add_book') }}" method="post">
      ID: <input type="text" name="id" /> Title:
      <input type="text" name="title" /> Author:
      <input type="text" name="author" /> Year:
      <input type="text" name="year" />
      <button type="submit">Add Book</button>
    </form>
  </body>
</html>
